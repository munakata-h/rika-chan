<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リカちゃんギャラリー</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 写真の並びとサイズを整える */
    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    #gallery img {
      width: 200px; 
      height: 150px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 5px;
    }
    #pagination {
      text-align: center;
      margin: 20px 0;
    }
    #pagination button {
      margin: 0 5px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>りかちゃんギャラリー</h1>
  <p>はなの手作りドレス</p>

  <div id="gallery"></div>
  <div id="pagination"></div>

  <div id="overlay">
    <img src="" alt="拡大画像">
  </div>

  <script>
    // --- 設定エリア ---
    const totalImages = 57;   // 現在の合計枚数（追加したらここを増やすだけ！）
    const imagesPerPage = 30; // 1ページ30枚
    let currentPage = 1;

    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const overlay = document.getElementById('overlay');
    const overlayImg = overlay.querySelector('img');

    function displayGallery(page) {
      gallery.innerHTML = '';
      const start = (page - 1) * imagesPerPage + 1;
      const end = Math.min(page * imagesPerPage, totalImages);

      for (let i = start; i <= end; i++) {
        const img = document.createElement('img');
        // 全て小文字の .jpg で統一
        const fileName = i.toString().padStart(3, '0') + '.jpg';
        
        img.src = fileName;
        img.alt = "Gallery Image " + i;

        img.addEventListener('click', () => {
          overlayImg.src = img.src;
          overlay.style.display = 'flex';
          // 拡大画像の設定
          overlayImg.style.width = 'auto';
          overlayImg.style.maxWidth = '90%';
          overlayImg.style.maxHeight = '90%';
        });
        gallery.appendChild(img);
      }
      setupPagination();
    }

    function setupPagination() {
      pagination.innerHTML = '';
      const pageCount = Math.ceil(totalImages / imagesPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        if (i === currentPage) {
          btn.style.backgroundColor = "#ccc";
          btn.style.fontWeight = "bold";
        }
        btn.addEventListener('click', () => {
          currentPage = i;
          displayGallery(currentPage);
          window.scrollTo(0, 0);
        });
        pagination.appendChild(btn);
      }
    }

    // 初回表示
    displayGallery(currentPage);

    // 拡大画面を閉じる
    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
    });
  </script>

</body>
</html>
