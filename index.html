<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リカちゃんギャラリー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>りかちゃんギャラリー</h1>
  <p>はなの手作りドレス</p>
  
  <div id="gallery" class="gallery"></div>

  <div id="pagination" style="text-align: center; margin: 20px;"></div>

  <div id="overlay"><img src="" alt=""></div>

<script>
  // --- 設定エリア ---
  const totalImages = 57; // 写真の総枚数（増えたらここを変えるだけ！）
  const imagesPerPage = 30; // 1ページに表示する枚数
  let currentPage = 1;

  const gallery = document.getElementById('gallery');
  const pagination = document.getElementById('pagination');
  const overlay = document.getElementById('overlay');
  const overlayImg = overlay.querySelector('img');

  // ギャラリーを表示する関数
  function displayGallery(page) {
    gallery.innerHTML = '';
    const start = (page - 1) * imagesPerPage + 1;
    const end = Math.min(page * imagesPerPage, totalImages);

    for (let i = start; i <= end; i++) {
      // 5番をスキップしたい場合などの処理
      if (i === 5) continue; 

      const img = document.createElement('img');
      // 数値を3桁（001形式）に変換。JPGとjpgが混在する場合は注意が必要
      // ここでは基本.jpg、14/24/47/54-57等をJPGとする例
      const ext = [14, 24, 47, 54, 55, 56, 57].includes(i) ? 'JPG' : 'jpg';
      const fileName = i.toString().padStart(3, '0') + '.' + ext;
      
      img.src = fileName;
      img.addEventListener('click', () => {
        overlayImg.src = img.src;
        const tempImg = new Image();
        tempImg.src = img.src;
        tempImg.onload = () => {
          overlayImg.style.width = tempImg.width * 2 + 'px';
          overlayImg.style.height = 'auto';
          overlay.style.display = 'flex';
        };
      });
      gallery.appendChild(img);
    }
    setupPagination();
  }

  // ページ移動ボタンを作る関数
  function setupPagination() {
    pagination.innerHTML = '';
    const pageCount = Math.ceil(totalImages / imagesPerPage);

    for (let i = 1; i <= pageCount; i++) {
      const btn = document.createElement('button');
      btn.innerText = i;
      btn.style.margin = "0 5px";
      btn.style.padding = "5px 10px";
      btn.style.cursor = "pointer";
      if (i === currentPage) {
        btn.style.backgroundColor = "#ccc"; // 現在のページを分かりやすく
      }
      btn.addEventListener('click', () => {
        currentPage = i;
        displayGallery(currentPage);
        window.scrollTo(0, 0); // ページ切り替え時に上に戻る
      });
      pagination.appendChild(btn);
    }
  }

  // 初回表示
  displayGallery(currentPage);

  // オーバーレイを閉じる処理
  overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
  });
</script>

</body>
</html>
