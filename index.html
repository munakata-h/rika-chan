<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リカちゃんギャラリー</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 写真の並び設定 */
    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: flex-start;
    }
    #gallery img {
      max-width: 250px; 
      height: auto;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* ページネーションボタンをさらに巨大化 */
    #pagination {
      text-align: center;
      margin: 60px 0; /* 上下の余白をさらにたっぷり確保 */
    }
    #pagination button {
      margin: 15px;        /* ボタン同士をしっかり離しました */
      padding: 25px 50px;  /* ボタンの面積を前回の約2倍に拡大 */
      font-size: 32px;     /* 数字もさらに巨大化（視認性アップ） */
      font-weight: bold;
      cursor: pointer;
      border: 2px solid #ccc; /* 枠線を少し太くしました */
      border-radius: 15px;    /* 角をもっと丸くして優しい印象に */
      background-color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* 押しやすそうな立体感を追加 */
      transition: 0.2s;
    }
    /* 現在のページのボタン（特大ピンク） */
    #pagination button.active {
      background-color: #ffb6c1; 
      color: white;
      border-color: #ffb6c1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <h1>りかちゃんギャラリー</h1>
  <p>はなの手作りドレス</p>

  <div id="gallery"></div>
  <div id="pagination"></div>

  <div id="overlay">
    <img src="" alt="拡大画像">
  </div>

  <script>
    // --- 設定エリア ---
    const totalImages = 57;   
    const imagesPerPage = 30; 
    let currentPage = 1;

    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const overlay = document.getElementById('overlay');
    const overlayImg = overlay.querySelector('img');

    function displayGallery(page) {
      gallery.innerHTML = '';
      const start = (page - 1) * imagesPerPage + 1;
      const end = Math.min(page * imagesPerPage, totalImages);

      for (let i = start; i <= end; i++) {
        const img = document.createElement('img');
        const fileName = i.toString().padStart(3, '0') + '.jpg';
        
        img.src = fileName;
        img.alt = "Gallery Image " + i;

        img.addEventListener('click', () => {
          overlayImg.src = img.src;
          overlay.style.display = 'flex';
          overlayImg.style.width = 'auto';
          overlayImg.style.maxWidth = '95%';
          overlayImg.style.maxHeight = '95%';
        });
        gallery.appendChild(img);
      }
      setupPagination();
    }

    function setupPagination() {
      pagination.innerHTML = '';
      const pageCount = Math.ceil(totalImages / imagesPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        
        if (i === currentPage) {
          btn.className = 'active';
        }

        btn.addEventListener('click', () => {
          currentPage = i;
          displayGallery(currentPage);
          window.scrollTo(0, 0); // ページ切り替え時に一番上に戻る
        });
        pagination.appendChild(btn);
      }
    }

    displayGallery(currentPage);

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
    });
  </script>

</body>
</html>
