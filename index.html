<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リカちゃんギャラリー</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 写真の並び設定（比率維持・顔が切れない設定） */
    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: flex-start;
    }
    #gallery img {
      max-width: 250px; 
      height: auto;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* ページネーションボタンを大きく使いやすくする設定 */
    #pagination {
      text-align: center;
      margin: 40px 0; /* 上下の余白を広げました */
    }
    #pagination button {
      margin: 0 10px;      /* ボタン同士の間隔を広げました */
      padding: 15px 25px;  /* ボタン自体のサイズを大きくしました */
      font-size: 22px;     /* 数字を大きくしました */
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 8px;  /* 角を少し丸くしてボタンらしく */
      background-color: #fff;
      transition: 0.3s;
    }
    /* 現在のページのボタンを目立たせる */
    #pagination button.active {
      background-color: #ffb6c1; /* 可愛いピンク色に変更 */
      color: white;
      border-color: #ffb6c1;
    }
  </style>
</head>
<body>

  <h1>りかちゃんギャラリー</h1>
  <p>はなの手作りドレス</p>

  <div id="gallery"></div>
  <div id="pagination"></div>

  <div id="overlay">
    <img src="" alt="拡大画像">
  </div>

  <script>
    // --- 設定エリア ---
    const totalImages = 57;   
    const imagesPerPage = 30; 
    let currentPage = 1;

    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const overlay = document.getElementById('overlay');
    const overlayImg = overlay.querySelector('img');

    function displayGallery(page) {
      gallery.innerHTML = '';
      const start = (page - 1) * imagesPerPage + 1;
      const end = Math.min(page * imagesPerPage, totalImages);

      for (let i = start; i <= end; i++) {
        const img = document.createElement('img');
        const fileName = i.toString().padStart(3, '0') + '.jpg';
        
        img.src = fileName;
        img.alt = "Gallery Image " + i;

        img.addEventListener('click', () => {
          overlayImg.src = img.src;
          overlay.style.display = 'flex';
          overlayImg.style.width = 'auto';
          overlayImg.style.maxWidth = '95%';
          overlayImg.style.maxHeight = '95%';
        });
        gallery.appendChild(img);
      }
      setupPagination();
    }

    function setupPagination() {
      pagination.innerHTML = '';
      const pageCount = Math.ceil(totalImages / imagesPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        
        // 現在のページにクラスを追加して目立たせる
        if (i === currentPage) {
          btn.className = 'active';
        }

        btn.addEventListener('click', () => {
          currentPage = i;
          displayGallery(currentPage);
          window.scrollTo(0, 0);
        });
        pagination.appendChild(btn);
      }
    }

    displayGallery(currentPage);

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
    });
  </script>

</body>
</html>
